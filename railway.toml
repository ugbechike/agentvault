# Railway service for the Fastify API.
# Set the Railway root directory to this monorepo (agentvault-poc), not apps/api.
# The web app deploys separately on Vercel with root directory apps/web.

[build]
builder = "NIXPACKS"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter @agentvault/api build"

[deploy]
startCommand = "node apps/api/dist/server.js"
healthcheckPath = "/health"
restartPolicyType = "ON_FAILURE"
